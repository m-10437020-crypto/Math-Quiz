<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Battle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050508;font-family:"Courier New",monospace;color:#fff}
button{font:inherit}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;filter:brightness(.78)}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px)}
.hud{position:absolute;top:0;left:0;right:0;height:108px;padding:18px 28px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(#000d,#0007,transparent);z-index:8;text-shadow:3px 3px #000}
.side{width:42%}
.side.enemy{text-align:right}
.name{font-size:clamp(18px,2.2vw,34px);font-weight:900;letter-spacing:2px}
.hearts{font-size:clamp(22px,2.8vw,42px);white-space:nowrap;filter:drop-shadow(2px 2px 0 #000)}
.heart.off{filter:grayscale(1) brightness(.35)}
.bar{height:12px;border:3px solid #fff;background:#111;margin-top:5px}
.fill{height:100%;width:100%;background:linear-gradient(90deg,#ffdf31,#ff4c4c);transition:width .35s}
.enemy .fill{margin-left:auto}
#round{position:absolute;top:20px;left:50%;transform:translateX(-50%);z-index:9;font-weight:900;font-size:clamp(15px,1.5vw,22px);text-shadow:2px 2px #000}
.fighter{position:absolute;bottom:4.5%;z-index:4;image-rendering:pixelated;transform-origin:50% 100%;filter:drop-shadow(0 8px 3px #0008)}
#blue{left:8%;height:min(48vh,500px);animation:idleBlue .62s ease-in-out infinite}
#red{right:7%;height:min(51vh,530px);animation:idleRed .62s ease-in-out infinite}
@keyframes idleBlue{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-9px) rotate(1deg)}}
@keyframes idleRed{0%,100%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(-9px) rotate(-1deg)}}

#quiz{position:absolute;z-index:10;left:50%;top:16%;transform:translateX(-50%);width:min(650px,48vw);padding:18px 20px 16px;background:#080810e8;border:4px solid #ffd83d;box-shadow:0 0 0 4px #111,0 0 22px #000;border-radius:4px;text-align:center}
#qtag{font-size:13px;color:#ffd83d;font-weight:900;letter-spacing:2px;margin-bottom:8px}
#question{font-size:clamp(19px,2vw,30px);font-weight:900;min-height:65px;display:flex;align-items:center;justify-content:center;line-height:1.2}
#answers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.answer{background:#17172a;color:#fff;border:2px solid #777;padding:10px 8px;cursor:pointer;font-weight:800;font-size:clamp(14px,1.25vw,19px);min-height:44px}
.answer:hover{border-color:#fff;background:#292947}
.answer:disabled{cursor:default;opacity:.75}
.answer.correct{background:#116b37;border-color:#5cff96}
.answer.wrong{background:#861e2b;border-color:#ff6170}

#banner{position:absolute;z-index:20;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;font-size:clamp(32px,5vw,76px);font-weight:1000;text-align:center;text-shadow:5px 5px #000,-2px -2px #000;color:#fff;white-space:nowrap}
#banner.show{animation:banner .9s ease both}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}18%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}

.energy{position:absolute;z-index:6;width:70px;height:70px;border-radius:50%;opacity:0;pointer-events:none;filter:blur(.2px);box-shadow:0 0 18px currentColor,0 0 35px currentColor inset}
.energy.blue{color:#4eeaff;background:radial-gradient(circle,#fff 0 15%,#5cf 30%,#1467ff 58%,transparent 70%)}
.energy.purple{color:#c65cff;background:radial-gradient(circle,#fff 0 12%,#e55cff 28%,#6a16b8 60%,transparent 72%)}
.spark{position:absolute;z-index:7;width:100px;height:100px;border-radius:50%;opacity:0;pointer-events:none;background:repeating-conic-gradient(#fff 0 8deg,#ffd83d 8deg 16deg,transparent 16deg 27deg)}
#game.shake{animation:shake .28s linear}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-2px)}80%{transform:translate(6px,3px)}}

#blue.attackDash{animation:blueDash .9s ease-in-out}
@keyframes blueDash{0%{transform:translate(0)}35%{transform:translate(48vw,-8px) rotate(-7deg)}55%{transform:translate(45vw,-4px) rotate(6deg)}100%{transform:translate(0)}}
#blue.spinAttack{animation:blueSpin 1s ease-in-out}
@keyframes blueSpin{0%{transform:translate(0) rotate(0)}50%{transform:translate(43vw,-35px) rotate(720deg)}100%{transform:translate(0) rotate(720deg)}}
#blue.jumpAttack{animation:blueJump 1s ease-in-out}
@keyframes blueJump{0%{transform:translate(0)}45%{transform:translate(40vw,-35vh) rotate(-25deg)}65%{transform:translate(46vw,-5vh) rotate(15deg)}100%{transform:translate(0)}}
#red.attackDash{animation:redDash .9s ease-in-out}
@keyframes redDash{0%{transform:translate(0)}38%{transform:translate(-48vw,-5px) rotate(8deg)}58%{transform:translate(-45vw,0) rotate(-5deg)}100%{transform:translate(0)}}
#red.spinAttack{animation:redSpin 1s ease-in-out}
@keyframes redSpin{0%{transform:translate(0) rotate(0)}50%{transform:translate(-45vw,-20px) rotate(-720deg)}100%{transform:translate(0) rotate(-720deg)}}
#red.jumpAttack{animation:redJump 1s ease-in-out}
@keyframes redJump{0%{transform:translate(0)}42%{transform:translate(-38vw,-38vh) rotate(20deg)}65%{transform:translate(-46vw,-4vh) rotate(-10deg)}100%{transform:translate(0)}}
#blue.hit{animation:blueHit .6s ease}
@keyframes blueHit{0%,100%{transform:translate(0);filter:drop-shadow(0 8px 3px #0008)}25%{transform:translate(-35px,-8px) rotate(-8deg);filter:brightness(2)}50%{transform:translate(-18px,0) rotate(5deg)}}
#red.hit{animation:redHit .6s ease}
@keyframes redHit{0%,100%{transform:translate(0);filter:drop-shadow(0 8px 3px #0008)}25%{transform:translate(35px,-8px) rotate(8deg);filter:brightness(2)}50%{transform:translate(18px,0) rotate(-5deg)}}

#overlay{position:absolute;inset:0;z-index:30;background:#05050beF;display:flex;align-items:center;justify-content:center;text-align:center}
.card{border:5px solid #ffd83d;padding:35px 45px;background:#090912;box-shadow:0 0 35px #000;max-width:720px}
.title{font-size:clamp(38px,6vw,88px);font-weight:1000;color:#ffd83d;text-shadow:5px 5px #6d2400;margin:0}
.sub{font-size:clamp(15px,1.5vw,22px);line-height:1.5;margin:15px 0 25px}
.bigbtn{padding:14px 24px;border:4px solid #fff;background:#b51d2d;color:#fff;font-size:clamp(18px,2vw,28px);font-weight:1000;cursor:pointer;box-shadow:5px 5px 0 #000}
.bigbtn:hover{transform:translateY(-2px)}
.hidden{display:none!important}

/* ===== EXTRA FIGHT ACTIONS ===== */
#blue.comboAttack{animation:blueCombo 1.25s ease-in-out}
@keyframes blueCombo{
  0%{transform:translate(0)}
  18%{transform:translate(10vw,-2vh) rotate(-6deg)}
  34%{transform:translate(30vw,-6vh) rotate(7deg)}
  48%{transform:translate(43vw,-3vh) rotate(-10deg)}
  62%{transform:translate(39vw,-1vh) rotate(8deg)}
  100%{transform:translate(0)}
}
#red.comboAttack{animation:redCombo 1.25s ease-in-out}
@keyframes redCombo{
  0%{transform:translate(0)}
  18%{transform:translate(-10vw,-2vh) rotate(6deg)}
  34%{transform:translate(-30vw,-6vh) rotate(-7deg)}
  48%{transform:translate(-43vw,-3vh) rotate(10deg)}
  62%{transform:translate(-39vw,-1vh) rotate(-8deg)}
  100%{transform:translate(0)}
}

#blue.kickRush{animation:blueKickRush 1.15s steps(7,end)}
@keyframes blueKickRush{
  0%{transform:translate(0)}
  18%{transform:translate(28vw,-3vh) rotate(-8deg)}
  28%{transform:translate(40vw,-2vh) rotate(8deg)}
  38%{transform:translate(37vw,-4vh) rotate(-10deg)}
  48%{transform:translate(42vw,-1vh) rotate(10deg)}
  58%{transform:translate(38vw,-3vh) rotate(-8deg)}
  68%{transform:translate(43vw,-1vh) rotate(8deg)}
  100%{transform:translate(0)}
}
#red.kickRush{animation:redKickRush 1.15s steps(7,end)}
@keyframes redKickRush{
  0%{transform:translate(0)}
  18%{transform:translate(-28vw,-3vh) rotate(8deg)}
  28%{transform:translate(-40vw,-2vh) rotate(-8deg)}
  38%{transform:translate(-37vw,-4vh) rotate(10deg)}
  48%{transform:translate(-42vw,-1vh) rotate(-10deg)}
  58%{transform:translate(-38vw,-3vh) rotate(8deg)}
  68%{transform:translate(-43vw,-1vh) rotate(-8deg)}
  100%{transform:translate(0)}
}

#blue.riseAttack{animation:blueRise 1.15s ease-in-out}
@keyframes blueRise{
  0%{transform:translate(0)}
  25%{transform:translate(18vw,-8vh) rotate(-10deg)}
  48%{transform:translate(38vw,-35vh) rotate(-26deg)}
  67%{transform:translate(44vw,-8vh) rotate(18deg)}
  100%{transform:translate(0)}
}
#red.riseAttack{animation:redRise 1.15s ease-in-out}
@keyframes redRise{
  0%{transform:translate(0)}
  25%{transform:translate(-18vw,-8vh) rotate(10deg)}
  48%{transform:translate(-38vw,-35vh) rotate(26deg)}
  67%{transform:translate(-44vw,-8vh) rotate(-18deg)}
  100%{transform:translate(0)}
}

#blue.fakeout{animation:blueFakeout 1.1s ease-in-out}
@keyframes blueFakeout{
  0%{transform:translate(0)}
  20%{transform:translate(-3vw,-18vh) rotate(-25deg)}
  42%{transform:translate(18vw,-32vh) rotate(15deg)}
  63%{transform:translate(43vw,-8vh) rotate(-12deg)}
  100%{transform:translate(0)}
}
#red.fakeout{animation:redFakeout 1.1s ease-in-out}
@keyframes redFakeout{
  0%{transform:translate(0)}
  20%{transform:translate(3vw,-18vh) rotate(25deg)}
  42%{transform:translate(-18vw,-32vh) rotate(-15deg)}
  63%{transform:translate(-43vw,-8vh) rotate(12deg)}
  100%{transform:translate(0)}
}

#blue.superAttack{animation:blueSuper 1.45s ease-in-out}
@keyframes blueSuper{
  0%{transform:translate(0) scale(1)}
  18%{transform:translate(0,-4vh) scale(1.08)}
  35%{transform:translate(20vw,-6vh) scale(1.05) rotate(-8deg)}
  52%{transform:translate(42vw,-3vh) scale(1.08) rotate(8deg)}
  66%{transform:translate(39vw,-1vh) scale(1.05) rotate(-7deg)}
  80%{transform:translate(43vw,-2vh) scale(1.08) rotate(7deg)}
  100%{transform:translate(0) scale(1)}
}
#red.superAttack{animation:redSuper 1.45s ease-in-out}
@keyframes redSuper{
  0%{transform:translate(0) scale(1)}
  18%{transform:translate(0,-4vh) scale(1.08)}
  35%{transform:translate(-20vw,-6vh) scale(1.05) rotate(8deg)}
  52%{transform:translate(-42vw,-3vh) scale(1.08) rotate(-8deg)}
  66%{transform:translate(-39vw,-1vh) scale(1.05) rotate(7deg)}
  80%{transform:translate(-43vw,-2vh) scale(1.08) rotate(-7deg)}
  100%{transform:translate(0) scale(1)}
}

#blue.charge,#red.charge{animation:chargeUp .42s ease-in-out 2}
@keyframes chargeUp{
  0%,100%{filter:drop-shadow(0 8px 3px #0008) brightness(1);transform:translateY(0) scale(1)}
  50%{filter:drop-shadow(0 0 18px #fff) brightness(1.65);transform:translateY(-5px) scale(1.04)}
}

#screenTint{
  position:absolute;inset:0;z-index:18;pointer-events:none;opacity:0;
}
#screenTint.blue{background:radial-gradient(circle at 35% 55%,rgba(40,170,255,.52),transparent 55%)}
#screenTint.purple{background:radial-gradient(circle at 65% 55%,rgba(170,60,255,.55),transparent 55%)}
#screenTint.flash{animation:tintFlash .9s ease}
@keyframes tintFlash{0%{opacity:0}25%{opacity:.85}65%{opacity:.32}100%{opacity:0}}

.afterimage{
  position:absolute;z-index:3;bottom:4.5%;pointer-events:none;opacity:.22;filter:blur(1px);
  image-rendering:pixelated;
}

#resultTitle.win{color:#ffe13e} #resultTitle.lose{color:#ff5163}
#attackName{position:absolute;z-index:19;left:50%;bottom:7%;transform:translateX(-50%);font-size:clamp(18px,2.5vw,38px);font-weight:1000;text-shadow:4px 4px #000;opacity:0;white-space:nowrap}
#attackName.pop{animation:attackName 1.1s ease}
@keyframes attackName{0%{opacity:0;transform:translateX(-50%) scale(.7)}20%,75%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0}}
@media(max-width:850px){
 #quiz{width:58vw;top:14%;padding:12px}
 #blue{height:38vh;left:3%} #red{height:41vh;right:2%}
 .hud{padding:12px;height:90px}.name{font-size:17px}
}
</style>
</head>
<body>
<div id="game">
  <img id="bg" alt="">
  <div class="scan"></div>
  <div class="hud">
    <div class="side"><div class="name">YOU</div><div class="bar"><div class="fill" id="blueBar"></div></div></div>
    <div class="side enemy"><div class="name">ENEMY</div><div class="bar"><div class="fill" id="redBar"></div></div></div>
  </div>
  <div id="round">QUIZ BATTLE</div>

  <img id="blue" class="fighter" alt="Blue fighter">
  <img id="red" class="fighter" alt="Red fighter">

  <div id="quiz">
    <div id="qtag">ALGEBRA CHALLENGE</div>
    <div id="question"></div>
    <div id="answers"></div>
  </div>

  <div id="banner"></div>
  <div id="attackName"></div>
  <div id="energy" class="energy"></div>
  <div id="spark" class="spark"></div>
  <div id="screenTint"></div>

  <div id="overlay">
    <div class="card">
      <h1 class="title">QUIZ BATTLE</h1>
      <div class="sub">Answer correctly to attack.<br>Answer wrongly and your opponent strikes.<br><b>First fighter to lose all their health loses!</b></div>
      <button class="bigbtn" id="startBtn">START BATTLE</button>
    </div>
  </div>

  <div id="result" class="hidden" style="position:absolute;inset:0;z-index:31;background:#05050bef;align-items:center;justify-content:center;text-align:center">
    <div class="card">
      <h1 class="title" id="resultTitle"></h1>
      <div class="sub" id="resultSub"></div>
      <button class="bigbtn" id="resultBtn"></button>
    </div>
  </div>
</div>

<script>
const ASSETS = {
  "red": "red-fighter.png",
  "blue": "blue-fighter.png",
  "bg": "background.png"
};
bg.src=ASSETS.bg; blue.src=ASSETS.blue; red.src=ASSETS.red;

const questions = [
 {q:"Solve: 5x − 8 = 27", a:["x = 5","x = 7","x = 9","x = 4"], c:1},
 {q:"Solve: 4(x + 2) = 32", a:["x = 4","x = 6","x = 8","x = 10"], c:1},
 {q:"Solve: 3x + 7 = 2x + 15", a:["x = 6","x = 7","x = 8","x = 9"], c:2},
 {q:"Solve: x/4 + 3 = 8", a:["x = 12","x = 16","x = 20","x = 24"], c:2},
 {q:"Expand: 3(2x − 5)", a:["6x − 5","6x − 15","5x − 15","6x + 15"], c:1},
 {q:"Simplify: 7x − 3 + 2x + 5", a:["9x + 2","9x − 8","5x + 2","9x + 8"], c:0},
 {q:"Factorise: x² + 5x + 6", a:["(x+1)(x+6)","(x+2)(x+3)","(x−2)(x−3)","(x+5)(x+1)"], c:1},
 {q:"Positive solution of x² − 16 = 0", a:["2","4","8","16"], c:1},
 {q:"If f(x)=2x+5, find f(4)", a:["9","11","13","15"], c:2},
 {q:"If f(x)=3x−1 and f(x)=20, find x", a:["6","7","8","9"], c:1},
 {q:"Solve: 2x + 9 = 25", a:["x = 6","x = 7","x = 8","x = 9"], c:2},
 {q:"Solve: 7x − 4 = 3x + 20", a:["x = 4","x = 5","x = 6","x = 7"], c:2},
 {q:"Expand: 2(3x + 4)", a:["5x + 4","6x + 4","6x + 8","3x + 8"], c:2},
 {q:"Simplify: 4x + 7 − x + 2", a:["3x + 9","5x + 9","3x + 5","3x − 9"], c:0},
 {q:"Factorise: x² + 7x + 12", a:["(x+2)(x+6)","(x+3)(x+4)","(x−3)(x−4)","(x+1)(x+12)"], c:1},
 {q:"Solve: 6(x − 1) = 30", a:["x = 4","x = 5","x = 6","x = 7"], c:2},
 {q:"If g(x)=x²+2, find g(3)", a:["9","10","11","12"], c:2},
 {q:"Solve: 5 − 2x = −9", a:["x = 5","x = 6","x = 7","x = 8"], c:2},
 {q:"Simplify: 3a + 4b + 2a − b", a:["5a+3b","a+3b","5a+5b","6a+3b"], c:0},
 {q:"Solve: (x + 3)/2 = 7", a:["x = 9","x = 10","x = 11","x = 14"], c:2},
 {q:"Factorise: x² − 9", a:["(x−9)(x+1)","(x−3)(x+3)","(x−3)²","(x+9)(x−1)"], c:1},
 {q:"Solve: 3(x + 4) = 27", a:["x = 4","x = 5","x = 6","x = 7"], c:1},
 {q:"If h(x)=4x−3, find h(5)", a:["15","17","19","23"], c:1},
 {q:"Simplify: 8y − 3y + 6", a:["5y+6","11y+6","5y−6","8y+3"], c:0},
 {q:"Solve: 9x + 2 = 5x + 26", a:["x = 4","x = 5","x = 6","x = 7"], c:2},
 {q:"Expand: −2(x − 6)", a:["−2x−12","−2x+12","2x−12","2x+12"], c:1},
 {q:"Solve: 2x/3 = 8", a:["x = 10","x = 12","x = 14","x = 16"], c:1},
 {q:"Factorise: x² + 8x + 15", a:["(x+3)(x+5)","(x+1)(x+15)","(x−3)(x−5)","(x+2)(x+6)"], c:0},
 {q:"If f(x)=x+4, find f(9)", a:["5","9","13","36"], c:2},
 {q:"Solve: 4x − 11 = 13", a:["x = 4","x = 5","x = 6","x = 7"], c:2}
];

const blueMoves = [
 ["KIKOKEN","projectile"],
 ["LIGHTNING LEGS","kickRush"],
 ["SPINNING BIRD KICK","spin"],
 ["TENSHO KICKS","rise"],
 ["HAZANSHU","fakeout"],
 ["SENRETSUKYAKU","combo"],
 ["KIKOSHO","superProjectile"],
 ["HOYOKU-SEN","super"]
];
const redMoves = [
 ["PSYCHO CRUSHER","spin"],
 ["DOUBLE KNEE PRESS","kickRush"],
 ["PSYCHO BLITZ","combo"],
 ["HEAD PRESS","rise"],
 ["SOMERSAULT SKULL DIVER","fakeout"],
 ["DEVIL REVERSE","fakeout"],
 ["SHADOW RISE","rise"],
 ["KNEE PRESS NIGHTMARE","super"],
 ["PSYCHO PUNISHER","superProjectile"],
 ["ULTIMATE PSYCHO CRUSHER","super"]
];

let blueHP=5, redHP=5, current=null, used=[], locked=false, qCount=0;
let blueMoveOrder=[], redMoveOrder=[], blueMovePos=0, redMovePos=0;
const $=id=>document.getElementById(id);
const game=$("game"), quiz=$("quiz"), banner=$("banner"), attackName=$("attackName");


function shuffledIndexes(length){
 const arr=Array.from({length},(_,i)=>i);
 for(let i=arr.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [arr[i],arr[j]]=[arr[j],arr[i]];
 }
 return arr;
}
function resetMoveRotation(){
 blueMoveOrder=shuffledIndexes(blueMoves.length);
 redMoveOrder=shuffledIndexes(redMoves.length);
 blueMovePos=0; redMovePos=0;
}
function nextMove(fromBlue){
 const moves=fromBlue?blueMoves:redMoves;
 let order=fromBlue?blueMoveOrder:redMoveOrder;
 let pos=fromBlue?blueMovePos:redMovePos;
 if(!order.length || pos>=order.length){
   order=shuffledIndexes(moves.length);
   pos=0;
   if(fromBlue) blueMoveOrder=order; else redMoveOrder=order;
 }
 const move=moves[order[pos]];
 if(fromBlue) blueMovePos=pos+1; else redMovePos=pos+1;
 return move;
}

function clearProjectile(){
 const e=$("energy");
 if(!e) return;
 if(e.getAnimations) e.getAnimations().forEach(a=>a.cancel());
 e.style.opacity="0";
 e.style.left="";
 e.style.top="";
 e.style.transform="";
 e.className="energy";
}

function hearts(n){return Array.from({length:5},(_,i)=>`<span class="heart ${i<n?"":"off"}">❤</span>`).join("")}
function updateHUD(){
 $("blueBar").style.width=(blueHP*20)+"%"; $("redBar").style.width=(redHP*20)+"%";
}
function restoreIdle(){
 const tempClasses=[
   "attackDash","spinAttack","jumpAttack","hit","comboAttack","kickRush",
   "riseAttack","fakeout","superAttack","charge"
 ];
 [$("blue"),$("red")].forEach(f=>{
   tempClasses.forEach(c=>f.classList.remove(c));
 });
}

function pickQuestion(){
 restoreIdle();
 clearProjectile();
 if(used.length>=questions.length) used=[];
 let i; do{i=Math.floor(Math.random()*questions.length)}while(used.includes(i));
 used.push(i); current=questions[i]; qCount++;
 $("round").textContent="QUESTION "+qCount;
 $("question").textContent=current.q;
 $("answers").innerHTML="";
 current.a.forEach((txt,i)=>{
   const b=document.createElement("button"); b.className="answer"; b.textContent=String.fromCharCode(65+i)+". "+txt;
   b.onclick=()=>answer(i,b); $("answers").appendChild(b);
 });
 locked=false;
}
function showBanner(text){
 banner.textContent=text; banner.classList.remove("show"); void banner.offsetWidth; banner.classList.add("show");
}
function popMove(name){
 attackName.textContent=name+"!"; attackName.classList.remove("pop"); void attackName.offsetWidth; attackName.classList.add("pop");
}
function disableAnswers(){document.querySelectorAll(".answer").forEach(b=>b.disabled=true)}
function sparkAt(target){
 const r=target.getBoundingClientRect(); const s=$("spark");
 s.style.left=(r.left+r.width/2-50)+"px"; s.style.top=(r.top+r.height/2-50)+"px";
 s.style.opacity="1"; s.animate([{transform:"scale(.2) rotate(0)",opacity:1},{transform:"scale(1.6) rotate(120deg)",opacity:0}],{duration:420});
 setTimeout(()=>s.style.opacity=0,430);
}
function shake(){game.classList.remove("shake");void game.offsetWidth;game.classList.add("shake")}
function projectile(fromBlue){
 clearProjectile();
 const e=$("energy"), from=fromBlue?$("blue"):$("red"), to=fromBlue?$("red"):$("blue");
 const a=from.getBoundingClientRect(), b=to.getBoundingClientRect();
 const sx=a.left+a.width/2-35, sy=a.top+a.height*.45-35;
 const ex=b.left+b.width/2-35, ey=b.top+b.height*.45-35;
 e.className="energy "+(fromBlue?"blue":"purple");
 e.style.left=sx+"px"; e.style.top=sy+"px"; e.style.opacity="1";
 const anim=e.animate(
   [{transform:"translate(0,0) scale(.6)",opacity:1},
    {transform:`translate(${ex-sx}px,${ey-sy}px) scale(1.25)`,opacity:1}],
   {duration:650,easing:"ease-in",fill:"forwards"}
 );
 anim.onfinish=()=>{
   e.style.opacity="0";
   if(anim) anim.cancel();
   e.style.transform="";
   e.style.left="";
   e.style.top="";
   e.className="energy";
   sparkAt(to);
   hit(to);
 };
 setTimeout(()=>clearProjectile(),900);
}
function hit(target){
 target.classList.remove("hit");
 void target.offsetWidth;
 target.classList.add("hit");
 shake();

 // Important: remove the hit animation class when it finishes,
 // so the normal idle stance immediately resumes.
 setTimeout(()=>target.classList.remove("hit"),620);
}
function tintScreen(fromBlue){
 const t=$("screenTint");
 t.className=(fromBlue?"blue":"purple")+" flash";
 setTimeout(()=>t.className="",950);
}

function spawnAfterimages(fromBlue){
 const fighter=fromBlue?$("blue"):$("red");
 for(let i=0;i<3;i++){
   const clone=fighter.cloneNode();
   clone.removeAttribute("id");
   clone.className="afterimage";
   clone.style.height=getComputedStyle(fighter).height;
   clone.style.left=fromBlue?(8+i*2)+"%":"auto";
   clone.style.right=fromBlue?"auto":(7+i*2)+"%";
   clone.style.transform=`translateX(${fromBlue?i*18:-i*18}px)`;
   game.appendChild(clone);
   setTimeout(()=>clone.remove(),380+i*90);
 }
}

function charge(attacker,fromBlue,superMove=false){
 attacker.classList.remove("charge");
 void attacker.offsetWidth;
 attacker.classList.add("charge");
 if(superMove) tintScreen(fromBlue);
 setTimeout(()=>attacker.classList.remove("charge"),850);
}

function multiHit(target,times=3,start=420,gap=120){
 for(let i=0;i<times;i++){
   setTimeout(()=>{sparkAt(target);hit(target)},start+i*gap);
 }
}

function animateAttack(fromBlue, move){
 const attacker=fromBlue?$("blue"):$("red"), target=fromBlue?$("red"):$("blue");
 const type=move[1];
 popMove(move[0]);

 if(type==="projectile"){
   // Projectile move: stay in place and fire the orb.
   // No dash/charge toward the opponent.
   projectile(fromBlue);
   return;
 }

 if(type==="superProjectile"){
   // Super projectile: stay in place while firing.
   // Energy effect is allowed, but there is no movement toward the opponent.
   tintScreen(fromBlue);
   projectile(fromBlue);
   setTimeout(()=>projectile(fromBlue),150);
   return;
 }

 spawnAfterimages(fromBlue);

 let cls="attackDash";
 if(type==="spin") cls="spinAttack";
 if(type==="jump") cls="jumpAttack";
 if(type==="combo") cls="comboAttack";
 if(type==="kickRush") cls="kickRush";
 if(type==="rise") cls="riseAttack";
 if(type==="fakeout") cls="fakeout";
 if(type==="super") cls="superAttack";

 if(type==="super"){
   // No separate charge animation: movement starts immediately.
   tintScreen(fromBlue);
   attacker.classList.remove(cls);
   void attacker.offsetWidth;
   attacker.classList.add(cls);
   multiHit(target,5,430,120);
   setTimeout(()=>attacker.classList.remove(cls),1500);
   return;
 }

 attacker.classList.remove(cls);
 void attacker.offsetWidth;
 attacker.classList.add(cls);

 if(type==="combo") multiHit(target,4,430,120);
 else if(type==="kickRush") multiHit(target,5,400,100);
 else if(type==="rise") multiHit(target,2,470,150);
 else if(type==="fakeout") multiHit(target,2,560,120);
 else setTimeout(()=>{sparkAt(target);hit(target)},520);

 setTimeout(()=>attacker.classList.remove(cls),1350);
}
function answer(i,btn){
 if(locked)return; locked=true; disableAnswers();
 const correct=i===current.c;
 btn.classList.add(correct?"correct":"wrong");
 if(!correct) document.querySelectorAll(".answer")[current.c].classList.add("correct");
 showBanner(correct?"CORRECT!":"WRONG!");

 // Start the selected attack immediately.
 if(correct){
   const m=nextMove(true);
   animateAttack(true,m);
   setTimeout(()=>{redHP--;updateHUD();afterHit()},780);
 }else{
   const m=nextMove(false);
   animateAttack(false,m);
   setTimeout(()=>{blueHP--;updateHUD();afterHit()},780);
 }
}
function afterHit(){
 setTimeout(()=>{
   if(redHP<=0) end(true);
   else if(blueHP<=0) end(false);
   else pickQuestion();
 },700);
}
function start(){
 restoreIdle();
 clearProjectile();
 resetMoveRotation();
 blueHP=5;redHP=5;qCount=0;used=[];updateHUD();
 $("overlay").classList.add("hidden"); $("result").classList.add("hidden"); $("result").style.display="none";
 pickQuestion();
}
function end(win){
 locked=true;
 clearProjectile();
 const r=$("result"); r.classList.remove("hidden");r.style.display="flex";
 const t=$("resultTitle"), b=$("resultBtn");
 if(win){
   t.textContent="YOU WIN!";t.className="title win";$("resultSub").textContent="Enemy defeated! Quiz Battle complete.";
   b.textContent="RETURN TO ARCADE"; b.onclick=()=>window.close();
 }else{
   t.textContent="GAME OVER";t.className="title lose";$("resultSub").textContent="You were defeated. Try the battle again!";
   b.textContent="TRY AGAIN"; b.onclick=start;
 }
}
$("startBtn").onclick=start;
updateHUD();
</script>
</body>
</html>
